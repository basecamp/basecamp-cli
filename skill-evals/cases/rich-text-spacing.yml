task: >-
  Post a status update as a comment on card 999 in project 555 for the
  schema-check work, with a short section for each of three things. What
  changed: the schema check can now stop a boot, refusing only a dropped table,
  column, unique key or hinted index, a column made invisible, or a column that
  must now be written. How it behaves on deploy: the refusal comes before /up,
  so the new container fails its health check and the old one keeps serving;
  small changes like added columns with defaults are only logged. The switch:
  HEY_DATABASE_SCHEMA_CHECK is refuse, report or off, set from the deploy file.
tags: [create, rich-text]
accept:
  - '--(in|project) 555'
  # The rejects below read the trace, so the body has to be in it: inline in
  # the create command, laid out in more than one block, both in that one
  # call. A body sent on stdin never reaches the trace and would pass them
  # unread.
  - 'comments? create (999|"999"|''999'')\s([\s\S]*\n\n[\s\S]*HEY_DATABASE_SCHEMA_CHECK|[\s\S]*HEY_DATABASE_SCHEMA_CHECK[\s\S]*\n\n)'
reject:
  # Basecamp shows blocks flush against each other unless a blank line in the
  # Markdown separates them, and in prose a single newline joins two lines
  # into one paragraph. A section label on a line of its own (bold, a heading,
  # or a capitalized line ending in a colon) followed directly by its text
  # runs label and text together. The next line must start flush left, so
  # indented lines in fenced code, such as a YAML key's value, don't count.
  # A line starts after a newline, or at the body's opening quote, the one
  # right after the comment's target.
  - '(\n|create \S+ ["''])(\*\*[^*\n]+\*\*|#+ [^\n]+|[A-Z][^*\n]*:)\n[^\s`]'
  # A line of text followed directly by a list item: the list sits flush
  # against the paragraph above it. A body that opens with a list is fine.
  - '(\n|create \S+ ["''])[^-*+\n0-9 `][^\n]*\n(?:[-*+] |[0-9]+\. )'
  # HTML is stored as written, so its spacing is whatever the agent typed.
  - '--format[ =]html'
  - '<(p|div|br|h[1-6])\b'
