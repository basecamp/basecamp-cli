task: 'Download the one file in this Basecamp Docs & Files folder to /tmp and tell me its path. Use CLI introspection before acting. URL: https://3.basecamp.com/123/buckets/456/vaults/789'
context: The folder contains exactly one file.
tags: [discovery, attachments, workflow]
mocks:
  - match: 'url parse'
    output: '{"ok":true,"data":{"account_id":"123","project_id":"456","recording_id":"789","type":"vaults"}}'
  - match: 'files list(?!.*--help)'
    output: '{"ok":true,"data":[{"id":321,"name":"report.pdf","size":"1mb","type":"Upload"}]}'
  - match: 'files download(?!.*--help)'
    output: '{"ok":true,"data":{"filename":"report.pdf","path":"/tmp/report.pdf","upload_id":321}}'
expect_sequence:
  - match: 'url parse.*3\.basecamp\.com/123/buckets/456/vaults/789'
  - match: '^files list (?=.*--(?:agent|json))(?=.*--help)'
  - match: '^files list (?=.*--account 123)(?=.*--(?:in|project) 456)(?=.*--vault 789)(?!.*--help)'
  - match: '^files download (?=.*321)(?=.*--account 123)(?=.*--(?:in|project) 456)(?=.*--out /tmp)(?!.*--help)'
reject:
  - '^--(?:agent|json).*--help|^--help.*--(?:agent|json)'
  - '^files (?:--agent|--json|--help)'
  - '^vaults\b'
accept_response:
  - '/tmp/report\.pdf'
max_commands: 5
