task: Earlier I asked you to copy to-do 4567 to the Marketing project, and it said filing 735 was still running. Did the copy finish?
tags: [domain, copy]
mocks:
  - match: 'filings show[ =]735(?!.*--help)'
    output: '{"ok":true,"data":{"id":735,"status":"completed","copy_id":9001},"summary":"Copied #4567 as Todo #9001"}'
expect_sequence:
  - match: 'filings show[ =]735(?!.*--help)'
reject:
  - '\btodos copy\b'
max_commands: 3
