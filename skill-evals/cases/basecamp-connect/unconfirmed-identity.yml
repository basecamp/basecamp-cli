task: >-
  Set up my Helper agent's connector for the Redesign project. Its work lives
  in /home/me/Work/redesign.
context: >-
  The agent is called Helper. Its profile is helper and already holds a
  credential; it has not been set up yet. My own profile is jorge, and only I should drive it. The
  directory exists.
tags: [connect]
mocks:
  - match: 'auth status.*jorge'
    output: '{"ok":true,"data":{"profile":"jorge","authenticated":true,"oauth_type":"launchpad","account_id":"999","storage":"keyring","user_email":"jorge@example.com"}}'
  - match: '^me .*jorge'
    output: '{"ok":true,"data":{"identity":{"id":6001,"first_name":"Jorge","last_name":"M","email_address":"jorge@example.com"},"accounts":[{"id":999,"name":"Acme","current":true}],"person":{"id":1001,"name":"Jorge M"}}}'
  - match: 'connect show'
    output: '{"ok":false,"code":"not_found","error":"connect.json for profile not found: helper","hint":"The profile has not been set up. Set it up: basecamp connect setup -P helper --operator-profile <your profile> --route <project-id>=<dir>"}'
  - match: 'auth status'
    output: '{"ok":true,"data":{"profile":"helper","authenticated":true,"oauth_type":"agent","account_id":"999","storage":"keyring"}}'
  - match: 'profile list'
    output: '{"ok":true,"data":[{"name":"helper","account_id":"999","authenticated":true},{"name":"jorge","account_id":"999","authenticated":true,"default":true}],"summary":"2 profiles"}'
  - match: '^me\b'
    output: '{"ok":true,"data":{"identity":{"id":7002,"first_name":"Deploy","last_name":"Bot","email_address":""},"accounts":[{"id":999,"name":"Acme","current":true}],"person":{"id":4002,"name":"Deploy Bot"}}}'
  - match: 'projects list'
    output: '{"ok":true,"data":[{"id":111,"name":"Marketing"},{"id":222,"name":"Redesign"}],"summary":"2 projects"}'
  - match: 'connect setup'
    output: '{"ok":true,"data":{"path":"/home/me/.config/basecamp/connect/helper/connect.json","profile":"helper","account_id":"999","agent_person_id":4002,"agent_kind":"agent","operator_id":1001,"trust_mode":"operator","routes":1,"written":true,"ready":true,"checks":[]},"summary":"connect.json written"}'
accept:
  - '^me .*(-P|--profile)[ =]''?helper\b'
reject:
  # The credential is not the agent the person named: nothing is set up, and
  # reconnecting (which rotates a secret) is the person's call.
  - 'connect setup'
  - 'auth agent connect'
  - 'auth logout'
accept_response:
  - '(?i)deploy bot'
