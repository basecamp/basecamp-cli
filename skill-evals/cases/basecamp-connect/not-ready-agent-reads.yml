task: >-
  Add our Redesign project to my agent's connector. Tell me whether it's
  ready.
context: >-
  The agent's profile is helper, already connected and set up before with me as
  the operator; my own profile is jorge.
tags: [connect]
mocks:
  - match: 'auth status.*jorge'
    output: '{"ok":true,"data":{"profile":"jorge","authenticated":true,"oauth_type":"launchpad","account_id":"999","storage":"keyring","user_email":"jorge@example.com"}}'
  - match: '^me .*jorge'
    output: '{"ok":true,"data":{"identity":{"id":6001,"first_name":"Jorge","last_name":"M","email_address":"jorge@example.com"},"accounts":[{"id":999,"name":"Acme","current":true}],"person":{"id":1001,"name":"Jorge M"}}}'
  - match: 'connect show'
    output: '{"ok":true,"data":{"path":"/home/me/.config/basecamp/connect/helper/connect.json","version":1,"profile":"helper","account_id":"999","agent":{"person_id":4001,"kind":"agent"},"trust":{"mode":"operator","operator_id":1001},"projects":{"111":{}},"driver":"spawn","concurrency":2,"deadline":"45m0s"},"summary":"Profile \"helper\": trust operator, 1 served project(s)"}'
  - match: 'auth status'
    output: '{"ok":true,"data":{"profile":"helper","authenticated":true,"oauth_type":"agent","account_id":"999","storage":"keyring"}}'
  - match: 'profile list'
    output: '{"ok":true,"data":[{"name":"helper","account_id":"999","authenticated":true},{"name":"jorge","account_id":"999","authenticated":true,"default":true}],"summary":"2 profiles"}'
  - match: 'projects list'
    output: '{"ok":true,"data":[{"id":111,"name":"Marketing"},{"id":222,"name":"Redesign"}],"summary":"2 projects"}'
  - match: 'connect setup'
    output: '{"ok":false,"code":"not_ready","error":"The connector is not ready, so /home/me/.config/basecamp/connect/helper/connect.json was not written. Project 222: Reading the project was refused (HTTP 403). Basecamp refuses this read to an Agent identity today, and admission makes it for every event: the connector would see mentions and block each one on a read it cannot make","hint":"If the agent is not on this project, add it there. Otherwise: Until Basecamp allows Agent identities these reads, run the connector as a bot user: basecamp connect setup -P <bot-profile> --expect-identity <identity-id>"}'
accept:
  - 'connect setup .*(-P|--profile)[ =]''?helper\b'
  - 'connect setup .*--serve[ =](''222''|222)(\s|$)'
reject:
  # What these evals guarantee about setup commands: every one in the trace
  # is a command the CLI would accept. The accepts above prove a correct one
  # was issued; these prove no incorrect one was, which is the half a model
  # can otherwise satisfy by issuing a command the CLI refuses and then
  # retrying — the broad setup mock answers success either way.
  #
  # --serve carries a project id and nothing else: digits ending the shell
  # word, bare or single-quoted, naming something above zero. Written as the
  # shape of a wrong value rather than as a list of wrong values, because
  # four rounds of review found four more spellings — and without lookahead,
  # so Go's RE2 reads the same pattern the Ruby runner does.
  #
  # This is deliberately narrower than parsePositiveID at one point: the CLI
  # takes a leading plus (+222 parses to 222) and a trace here may not. The
  # guard in internal/commands/connect_skilleval_test.go holds both halves —
  # that everything these patterns allow is something the CLI accepts, and
  # that everything the CLI refuses is something they reject — with +222, 0,
  # 000, 007 and the empty value in its corpus, so neither the narrowing nor
  # a disagreement can be accidental.
  - 'connect setup .*--serve[ =]([0-9]*[^0-9\s'']|0+(\s|$)|''[0-9]*[^0-9'']|''0*'')'
  - 'connect setup .*--serve=(\s|$)'
  # And the flag that no longer exists, in any spelling.
  - 'connect setup .*--(route|remove-route)\b'
  - 'auth agent connect'
  - 'auth logout'
  - 'auth login'
  - 'profile create'
  - '--unserve'
  - '--with-token'
accept_response:
  - '(?i)bot[- ]user'
  - '(?i)(member|add(ed)? (the agent )?to|on the project|in the project)'
  - '(?i)(not|n.t)\W+(be(en)?\W+)?(written|write|changed|saved|added|add|served)\b|nothing\W+(was\W+)?(written|changed)|unchanged'
