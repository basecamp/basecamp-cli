task: >-
  Connect my new agent to this computer and set it up so it works on our
  Redesign project. When it's set up I'd like it running.
context: >-
  Everything you need is here, so don't stop to ask: the agent's profile should
  be called helper, and the agent is called Helper: if the credential turns
  out to be Helper, I confirm that is the agent. My own profile is jorge.
  Only I should be able to drive the agent. Redesign's work lives in
  /home/me/Work/redesign, which exists and is a git repository. When a
  connection link and code are printed I open the link and approve the
  connection.
tags: [connect]
mocks:
  - match: 'auth status.*jorge'
    output: '{"ok":true,"data":{"profile":"jorge","authenticated":true,"oauth_type":"launchpad","account_id":"999","storage":"keyring","user_email":"jorge@example.com"}}'
  - match: '^me .*jorge'
    output: '{"ok":true,"data":{"identity":{"id":6001,"first_name":"Jorge","last_name":"M","email_address":"jorge@example.com"},"accounts":[{"id":999,"name":"Acme","current":true}],"person":{"id":1001,"name":"Jorge M"}}}'
  - match: 'connect show'
    output: '{"ok":false,"code":"not_found","error":"connect.json for profile not found: helper","hint":"The profile has not been set up. Set it up: basecamp connect setup -P helper --operator-profile <your profile> --route <project-id>=<dir>"}'
  - match: 'auth status'
    output: '{"ok":false,"code":"api_error","error":"unknown profile \"helper\" (available: jorge)"}'
  - match: 'profile list'
    output: '{"ok":true,"data":[{"name":"jorge","account_id":"999","authenticated":true,"base_url":"https://3.basecampapi.com","default":true}],"summary":"1 profile"}'
  - match: 'auth agent connect'
    output: "Open this link and enter the code ABCD-EFGH to approve the connection.\nWaiting for approval...\n\nConnected profile \"helper\" to a Basecamp agent\nProfile: helper · Account: 999 · Access: full · Token: minted on demand, no refresh token\nCreated profile \"helper\" for account 999\nCheck it any time: basecamp auth status -P helper"
  - match: '^me\b'
    output: '{"ok":true,"data":{"identity":{"id":7001,"first_name":"Helper","last_name":"","email_address":""},"accounts":[{"id":999,"name":"Acme","current":true}],"person":{"id":4001,"name":"Helper"}}}'
  - match: 'projects list'
    output: '{"ok":true,"data":[{"id":111,"name":"Marketing"},{"id":222,"name":"Redesign"},{"id":333,"name":"Redesign Archive"}],"summary":"3 projects"}'
  - match: 'connect setup(?!.*--route)'
    output: '{"ok":false,"code":"usage","error":"Setup needs to know who the operator is","hint":"Pass --operator-profile <your profile> (or --operator <your person id>). The operator is the person the agent takes instructions from, and is never guessed."}'
  - match: 'connect setup'
    output: '{"ok":true,"data":{"path":"/home/me/.config/basecamp/connect/helper/connect.json","profile":"helper","account_id":"999","agent_person_id":4001,"agent_kind":"agent","operator_id":1001,"trust_mode":"operator","routes":1,"written":true,"ready":true,"checks":[{"name":"Token","status":"pass","message":"The profile''s credential yields a token"},{"name":"Identity","status":"pass","message":"Agent person 4001"},{"name":"Scope","status":"pass","message":"Full access: the agent can reply and acknowledge"},{"name":"Operator","status":"pass","message":"Person 1001, Jorge, the identity of profile \"jorge\""},{"name":"Stream ticket","status":"pass","message":"The agent can mint a ticket for the account event feed"},{"name":"Project 222","status":"pass","message":"Readable by the agent, routed to /home/me/Work/redesign"}]},"summary":"connect.json written; 6 passed"}'
expect_sequence:
  - match: 'auth agent connect .*(-P|--profile)[ =]''?helper\b'
  - match: '^me .*(-P|--profile)[ =]''?helper\b'
  - match: 'connect setup'
accept:
  - 'connect setup .*(-P|--profile)[ =]''?helper\b'
  - 'connect setup .*--operator-profile[ =]''?jorge\b'
  - 'connect setup .*--route[ =]''?222=''?/home/me/Work/redesign\b'
reject:
  - '--with-token'
  - '--with-client-credentials'
  # Every machine-output mode the interactive connection refuses.
  - 'auth agent connect.*(--json|--agent|--quiet|--ids-only|--count|--jq|-j\b|-q\b)'
  - 'connect setup .*--operator[ =]'
  - 'connect setup .*--route[ =]''?333='
  - 'connect setup .*--(trust[ =]''?(allowlist|project)|allow[ =])'
  - '--expect-identity'
  - 'connect (run|start|service)'
accept_response:
  - '(?i)(not|n.t)\b[^.]{0,60}\b(yet|available|part of|built)'
