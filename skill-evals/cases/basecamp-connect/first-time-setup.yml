task: >-
  Connect my new agent to this computer and set it up so it works on our
  Redesign project. When it's set up I'd like it running.
context: >-
  Everything you need is here, so don't stop to ask: the agent's profile should
  be called helper, and the agent is called Helper: if the credential turns
  out to be Helper, I confirm that is the agent. My own profile is jorge.
  Only I should be able to drive the agent. When a connection link and code
  are printed I open the link and approve the connection.
tags: [connect]
mocks:
  - match: 'auth status.*jorge'
    output: '{"ok":true,"data":{"profile":"jorge","authenticated":true,"oauth_type":"launchpad","account_id":"999","storage":"keyring","user_email":"jorge@example.com"}}'
  - match: '^me .*jorge'
    output: '{"ok":true,"data":{"identity":{"id":6001,"first_name":"Jorge","last_name":"M","email_address":"jorge@example.com"},"accounts":[{"id":999,"name":"Acme","current":true}],"person":{"id":1001,"name":"Jorge M"}}}'
  - match: 'connect show'
    output: '{"ok":false,"code":"not_found","error":"connect.json for profile not found: helper","hint":"The profile has not been set up. Set it up: basecamp connect setup -P helper --operator-profile <your profile> --serve <project-id>"}'
  - match: 'auth status'
    output: '{"ok":false,"code":"api_error","error":"unknown profile \"helper\" (available: jorge)"}'
  - match: 'profile list'
    output: '{"ok":true,"data":[{"name":"jorge","account_id":"999","authenticated":true,"base_url":"https://3.basecampapi.com","default":true}],"summary":"1 profile"}'
  - match: 'auth agent connect'
    output: "Open this link and enter the code ABCD-EFGH to approve the connection.\nWaiting for approval...\n\nConnected profile \"helper\" to a Basecamp agent\nProfile: helper · Account: 999 · Access: full · Token: minted on demand, no refresh token\nCreated profile \"helper\" for account 999\nCheck it any time: basecamp auth status -P helper"
  - match: '^me\b'
    output: '{"ok":true,"data":{"identity":{"id":7001,"first_name":"Helper","last_name":"","email_address":""},"accounts":[{"id":999,"name":"Acme","current":true}],"person":{"id":4001,"name":"Helper"}}}'
  - match: 'projects list'
    output: '{"ok":true,"data":[{"id":111,"name":"Marketing"},{"id":222,"name":"Redesign"},{"id":333,"name":"Redesign Archive"}],"summary":"3 projects"}'
  - match: 'connect setup(?!.*--serve)'
    output: '{"ok":false,"code":"usage","error":"Setup needs to know who the operator is","hint":"Pass --operator-profile <your profile> (or --operator <your person id>). The operator is the person the agent takes instructions from, and is never guessed."}'
  - match: 'connect setup'
    output: '{"ok":true,"data":{"path":"/home/me/.config/basecamp/connect/helper/connect.json","profile":"helper","account_id":"999","agent_person_id":4001,"agent_kind":"agent","operator_id":1001,"trust_mode":"operator","projects":1,"written":true,"ready":true,"checks":[{"name":"Token","status":"pass","message":"The profile''s credential yields a token"},{"name":"Identity","status":"pass","message":"Agent person 4001"},{"name":"Scope","status":"pass","message":"Full access: the agent can reply and acknowledge"},{"name":"Operator","status":"pass","message":"Person 1001, Jorge, the identity of profile \"jorge\""},{"name":"Stream ticket","status":"pass","message":"The agent can mint a ticket for the account event feed"},{"name":"Project 222","status":"pass","message":"Readable by the agent"}]},"summary":"connect.json written; 6 passed"}'
expect_sequence:
  - match: 'auth agent connect .*(-P|--profile)[ =]''?helper\b'
  - match: '^me .*(-P|--profile)[ =]''?helper\b'
  - match: 'connect setup'
accept:
  - 'connect setup .*(-P|--profile)[ =]''?helper\b'
  - 'connect setup .*--operator-profile[ =]''?jorge\b'
  - 'connect setup .*--serve[ =](''222''|"222"|222)(\s|$)'
reject:
  # What these evals guarantee about setup commands: every one in the trace
  # is a command the CLI would accept. The accepts above prove a correct one
  # was issued; these prove no incorrect one was, which is the half a model
  # can otherwise satisfy by issuing a command the CLI refuses and then
  # retrying — the broad setup mock answers success either way.
  #
  # --serve carries a project id and nothing else: digits ending the shell
  # word, bare or quoted either way, naming something above zero. Written as the
  # shape of a wrong value rather than as a list of wrong values, because
  # four rounds of review found four more spellings — and without lookahead,
  # so Go's RE2 reads the same pattern the Ruby runner does.
  #
  # Deliberately narrower than parsePositiveID in two places, both of which
  # the guard in internal/commands/connect_skilleval_test.go asserts rather
  # than leaves implicit: a leading plus (+222 parses to 222) and fragments
  # the shell would join into one word ('22''2' is 222). A trace may use
  # neither. That guard holds both directions — everything these patterns
  # allow, the CLI must accept; everything the CLI refuses, they must reject
  # — and its doc comment names what it cannot model, which is the shell
  # itself.
  - 'connect setup .*--serve[ =]([0-9]*[^0-9\s''"]|0+(\s|$)|''[0-9]*[^0-9'']|''0*''|''[0-9]*''[^\s]|"[0-9]*[^0-9"]|"0*"|"[0-9]*"[^\s]|[0-9]+[''"])'
  - 'connect setup .*--serve=(\s|$)'
  # And --serve with no value at all, which cobra refuses outright.
  - 'connect setup .*--serve\s*$'
  # A value of all digits can still be too large for an int64, which no
  # shape can see. Capped at 18 digits, comfortably above any real
  # project id and safely below the 19 of MaxInt64 — so a trace may not
  # carry 9223372036854775807 either, which the CLI would take. That
  # narrowing is declared in the guard's corpus rather than left here.
  - 'connect setup .*--serve[ =][''"]?[0-9]{19}'
  # And the flag that no longer exists, in any spelling.
  - 'connect setup .*--(route|remove-route)\b'
  # --unserve has no place in either of these scenarios: nothing is served
  # yet to withdraw. Paired with --serve in one run it is worse than useless,
  # because setup.Apply refuses the run outright ("project %d is both served
  # and removed in one run"), so the agent would have done nothing at all.
  - 'connect setup .*--unserve\b'
  - '--with-token'
  - '--with-client-credentials'
  # Every machine-output mode the interactive connection refuses.
  - 'auth agent connect.*(--json|--agent|--quiet|--ids-only|--count|--jq|-j\b|-q\b)'
  - 'connect setup .*--operator[ =]'
  - 'connect setup .*--serve[ =]''?333\b'
  - 'connect setup .*--(trust[ =]''?(allowlist|project)|allow[ =])'
  - '--expect-identity'
  - 'connect (run|start|service)'
accept_response:
  - '(?i)(not|n.t)\b[^.]{0,60}\b(yet|available|part of|built)'
