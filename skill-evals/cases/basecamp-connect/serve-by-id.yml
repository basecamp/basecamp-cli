task: >-
  Add our project called "Launch $(date)" to my agent's connector.
context: >-
  The agent's profile is helper; it is already connected, its identity is
  confirmed, and it was set up before with me as the operator (my profile is
  jorge). Don't stop to ask.
tags: [connect]
mocks:
  - match: 'auth status.*jorge'
    output: '{"ok":true,"data":{"profile":"jorge","authenticated":true,"oauth_type":"launchpad","account_id":"999","storage":"keyring","user_email":"jorge@example.com"}}'
  - match: '^me .*jorge'
    output: '{"ok":true,"data":{"identity":{"id":6001,"first_name":"Jorge","last_name":"M","email_address":"jorge@example.com"},"accounts":[{"id":999,"name":"Acme","current":true}],"person":{"id":1001,"name":"Jorge M"}}}'
  - match: 'connect show'
    output: '{"ok":true,"data":{"path":"/home/me/.config/basecamp/connect/helper/connect.json","version":1,"profile":"helper","account_id":"999","agent":{"person_id":4001,"kind":"agent"},"trust":{"mode":"operator","operator_id":1001},"projects":{"111":{}},"driver":"spawn","concurrency":2,"deadline":"45m0s"},"summary":"Profile \"helper\": trust operator, 1 served project(s)"}'
  - match: 'auth status'
    output: '{"ok":true,"data":{"profile":"helper","authenticated":true,"oauth_type":"agent","account_id":"999","storage":"keyring"}}'
  - match: 'projects list'
    output: '{"ok":true,"data":[{"id":111,"name":"Marketing"},{"id":222,"name":"Launch $(date)"}],"summary":"2 projects"}'
  - match: 'connect setup'
    output: '{"ok":true,"data":{"path":"/home/me/.config/basecamp/connect/helper/connect.json","profile":"helper","account_id":"999","agent_person_id":4001,"agent_kind":"agent","operator_id":1001,"trust_mode":"operator","projects":2,"written":true,"ready":true,"checks":[{"name":"Project 222","status":"pass","message":"Readable by the agent"}]},"summary":"connect.json written; all passed"}'
accept:
  - 'connect setup .*(-P|--profile)[ =]''?helper\b'
  - 'connect setup .*--serve[ =](''222''|"222"|222)(\s|$)'
reject:
  # What these evals guarantee about setup commands: every one in the trace
  # is a command the CLI would accept. The accepts above prove a correct one
  # was issued; these prove no incorrect one was, which is the half a model
  # can otherwise satisfy by issuing a command the CLI refuses and then
  # retrying — the broad setup mock answers success either way.
  #
  # --serve carries a project id and nothing else: digits ending the shell
  # word, bare or quoted either way, naming something above zero. Written as the
  # shape of a wrong value rather than as a list of wrong values, because
  # four rounds of review found four more spellings — and without lookahead,
  # so Go's RE2 reads the same pattern the Ruby runner does.
  #
  # Deliberately narrower than parsePositiveID in two places, both of which
  # the guard in internal/commands/connect_skilleval_test.go asserts rather
  # than leaves implicit: a leading plus (+222 parses to 222) and fragments
  # the shell would join into one word ('22''2' is 222). A trace may use
  # neither. That guard holds both directions — everything these patterns
  # allow, the CLI must accept; everything the CLI refuses, they must reject
  # — and its doc comment names what it cannot model, which is the shell
  # itself.
  - 'connect setup .*--serve[ =]([0-9]*[^0-9\s''"]|0+(\s|$)|''[0-9]*[^0-9'']|''0*''|''[0-9]*''[^\s]|"[0-9]*[^0-9"]|"0*"|"[0-9]*"[^\s]|[0-9]+[''"])'
  - 'connect setup .*--serve=(\s|$)'
  # And --serve with no value at all, which cobra refuses outright.
  - 'connect setup .*--serve\s*$'
  # A value of all digits can still be too large for an int64, which no
  # shape can see. Capped at 18 digits, comfortably above any real
  # project id and safely below the 19 of MaxInt64 — so a trace may not
  # carry 9223372036854775807 either, which the CLI would take. That
  # narrowing is declared in the guard's corpus rather than left here.
  - 'connect setup .*--serve[ =][''"]?[0-9]{19}'
  # And the flag that no longer exists, in any spelling.
  - 'connect setup .*--(route|remove-route)\b'
  # --unserve has no place in either of these scenarios: nothing is served
  # yet to withdraw. Paired with --serve in one run it is worse than useless,
  # because setup.Apply refuses the run outright ("project %d is both served
  # and removed in one run"), so the agent would have done nothing at all.
  - 'connect setup .*--unserve\b'
  # The name never reaches a command; only its id does. A project name is the
  # one value here nobody controls, and it can hold anything a shell would act
  # on.
  - '\$\(date\)'
  - 'Launch'
