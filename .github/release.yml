changelog:
  exclude:
    labels:
      - dependencies
      - github_actions
      # The release PR scripts/release.sh opens to stamp the version.
      - release
    authors:
      - dependabot[bot]
  categories:
    - title: "⚠️ Breaking Changes"
      labels:
        - breaking
    - title: Features
      labels:
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Other Changes
      labels:
        - "*"
