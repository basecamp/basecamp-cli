# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Go modules
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    groups:
      go-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 10
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
    # basecamp-sdk bumps come from coworker's sdk-bump the day a release is
    # published, as one PR that refreshes the vendorHash and opens even when
    # the bump doesn't compile, with the errors listed. Each 0.x minor breaks
    # the API, so Dependabot's grouped bump arrived days late and red (#911).
    # A name-only ignore stops version updates and keeps security updates:
    # Dependabot applies only an ignore's explicit `versions` to those.
    ignore:
      - dependency-name: "github.com/basecamp/basecamp-sdk/go"
    commit-message:
      prefix: "deps"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 10
    commit-message:
      prefix: "ci"

  # Container base images (digest pins in Dockerfile)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    groups:
      docker:
        patterns:
          - "*"
    cooldown:
      default-days: 10
    commit-message:
      prefix: "build"
