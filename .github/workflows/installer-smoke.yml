name: Installer Smoke

# Post-deploy canary for the published installer (#558/#568). The install
# endpoint serves main, so merge == deploy for scripts/install.sh: the bats
# suite gates pre-merge, and this catches a broken published installer after.
# Runs the documented Quick Start shape (curl pipe to bash), not a checkout.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/install.sh
      - scripts/install.ps1

permissions: {}

# Deliberately NO workflow-level BASECAMP_NO_KEYRING: the deployed installer
# sets it per-command for its own best-effort children (the belt for release
# binaries <= v0.7.2, whose eager startup keyring probe hangs on a locked
# headless keychain), and the canary must exercise that deployed belt — on the
# macOS leg a missing belt means a hung `security` child, a 10-minute timeout,
# and a notify. The direct `basecamp version` asserts don't need the var:
# help/version skip the CLI's PersistentPreRunE and never reach the probe.
concurrency:
  group: installer-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux (modern bash)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install from the published endpoint
        run: |
          # Scratch HOME + explicit BASECAMP_BIN_DIR contain the installer's
          # writes: even with the wizard and agent connection skipped, it
          # still edits shell config and installs the baseline skill.
          smoke_root=$(mktemp -d)
          mkdir -p "$smoke_root/home" "$smoke_root/bin"
          export HOME="$smoke_root/home"
          export BASECAMP_BIN_DIR="$smoke_root/bin"
          export BASECAMP_SKIP_SETUP=1
          export BASECAMP_SETUP_AGENT=none

          # Cache-bust with the commit SHA: raw.githubusercontent.com serves
          # max-age=300, so a push-triggered run could otherwise fetch the
          # pre-push installer and falsely pass. The canonical endpoint
          # preserves the query string on redirect, making each commit's
          # request cache-distinct.
          curl -fsSL "https://basecamp.com/install-cli?sha=${GITHUB_SHA}" | bash

          # Assert the deterministic installed path, not ambient PATH.
          "$BASECAMP_BIN_DIR/basecamp" version

  macos:
    name: macOS (stock bash 3.2)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Install via stock /bin/bash
        run: |
          # Assert exactly Bash 3.2, through the same interpreter that runs
          # the install — honest 3.2 coverage instead of silently degrading
          # if a future runner image changes /bin/bash.
          /bin/bash -c '[[ "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" == "3.2" ]]' \
            || { echo "/bin/bash is not Bash 3.2:" >&2; /bin/bash --version >&2; exit 1; }

          smoke_root=$(mktemp -d)
          mkdir -p "$smoke_root/home" "$smoke_root/bin"
          export HOME="$smoke_root/home"
          export BASECAMP_BIN_DIR="$smoke_root/bin"
          export BASECAMP_SKIP_SETUP=1
          export BASECAMP_SETUP_AGENT=none

          curl -fsSL "https://basecamp.com/install-cli?sha=${GITHUB_SHA}" | /bin/bash

          "$BASECAMP_BIN_DIR/basecamp" version

  windows:
    name: Windows (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # powershell (5.1) is the stock interpreter the README's `irm | iex`
        # shape targets and exercises install.ps1's 5.1-specific branches;
        # pwsh covers PowerShell 7.
        shell: [powershell, pwsh]
    steps:
      - name: Install from the published endpoint
        # GitHub Actions does not evaluate expressions in steps[*].shell, so a
        # pwsh launcher step invokes the matrix interpreter explicitly. The
        # documented `irm | iex` shape — fetch and execution both — runs
        # entirely inside the target interpreter; the launcher only sets env
        # (inherited by the child) and asserts afterwards.
        shell: pwsh
        env:
          SMOKE_SHELL: ${{ matrix.shell }}
        run: |
          # Scratch USERPROFILE + explicit BASECAMP_BIN_DIR contain the
          # installer's and the child basecamp.exe's writes (Go os.UserHomeDir
          # reads USERPROFILE). Ensure-UserPath's HKCU PATH write is
          # unavoidable but disposable on ephemeral runners.
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'installer-smoke'
          New-Item -ItemType Directory -Force -Path (Join-Path $smokeRoot 'home') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $smokeRoot 'bin') | Out-Null
          $env:USERPROFILE = Join-Path $smokeRoot 'home'
          $env:BASECAMP_BIN_DIR = Join-Path $smokeRoot 'bin'
          $env:BASECAMP_SKIP_SETUP = '1'
          $env:BASECAMP_SETUP_AGENT = 'none'

          # Documented Quick Start shape, cache-busted: raw.githubusercontent.com
          # varies its cache key on unknown query params, so ?sha= keeps each
          # commit's request cache-distinct (no basecamp.com endpoint exists
          # for the PowerShell installer). Single-quoted so the inner
          # interpreter expands $env:GITHUB_SHA itself.
          & $env:SMOKE_SHELL -NoProfile -Command 'irm "https://raw.githubusercontent.com/basecamp/basecamp-cli/main/scripts/install.ps1?sha=$env:GITHUB_SHA" | iex'
          if ($LASTEXITCODE -ne 0) { throw "installer exited $LASTEXITCODE under $env:SMOKE_SHELL" }

          & "$env:BASECAMP_BIN_DIR\basecamp.exe" version
          if ($LASTEXITCODE -ne 0) { throw "basecamp version exited $LASTEXITCODE" }

  notify:
    name: Notify on failure
    needs: [linux, macos, windows]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # contents: read cannot be inherited — this workflow sets permissions: {}
    # at the top, so without it the checkout that fetches notify-issue.sh has
    # no repository access and the job dies before it can file the issue.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File or update canary failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          BODY="The installer canary failed (event: ${EVENT_NAME}). Legs: linux=${LINUX_RESULT}, macos=${MACOS_RESULT}, windows=${WINDOWS_RESULT}. See ${RUN_URL} for details."

          # Dedup lives in notify-issue.sh, shared with release.yml and
          # aur-publish.yml, and keys on the installer-canary label rather
          # than the title — a title lookup misses the moment someone
          # retitles the issue while triaging it, and this job used to carry
          # exactly that inline title-based copy.
          notify_status=0
          scripts/notify-issue.sh \
            --repo "$REPO_SLUG" \
            --label installer-canary \
            --title "Installer canary failure" \
            --body "$BODY" || notify_status=$?

          # Always emit the annotation, whatever the notifier did. It fails
          # closed rather than filing a duplicate, so on a lookup failure
          # this is the only signal left.
          echo "::error::Installer canary failed. See ${RUN_URL}"
          exit "$notify_status"

  recover:
    name: Close canary issue on recovery
    needs: [linux, macos, windows]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close open canary failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Same key as the notify job: the installer-canary label, which
          # survives retitling. A green canary invalidates every open canary
          # issue; one worth keeping open past recovery should shed the label.
          #
          # Lookup failure is not "nothing open": skip the close and let the
          # next green run retry, but say so in the annotations.
          if ! matches=$(gh issue list --state open --label installer-canary --json number --jq '.[].number'); then
            echo "::warning::Could not list open installer-canary issues; leaving any open issue for the next green run."
            exit 0
          fi
          for number in $matches; do
            gh issue close "$number" --comment "All installer legs are green again: ${RUN_URL}"
          done
