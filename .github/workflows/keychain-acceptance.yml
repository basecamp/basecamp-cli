name: Keychain Acceptance

# Black-box acceptance test for the #568 incident class: on headless macOS with
# a locked login keychain, constructing the credential store used to block
# forever in an uncancellable `security` child. Unit tests cover the pieces
# (bounded probe kills and reaps its child; the store is lazy; headless implies
# a 10s bound) — nothing else runs the real binary against a really blocking
# keychain and asserts the command finishes inside the bound.
#
# Locking a keychain is why this was a manual VM ritual. A hosted runner is
# disposable, so it can be locked without consequence.
#
# The command runs over `ssh localhost`, not directly in the job step. A GitHub
# macOS runner step reports `launchctl managername: Aqua` — it has a GUI session
# — so sessionIsHeadless() is false there and the bounded-probe path never
# engages. Over ssh the session manager is Background with no TTY attached,
# which is not a workaround for the runner but the actual #568 scenario: a
# piped installer over ssh with no way to answer an unlock prompt. Remote Login
# is already enabled on the hosted image; only an authorized_keys entry is
# needed.

on:
  workflow_call:
    # The point of the design: release.yml invokes this against the exact tag
    # SHA. workflow_dispatch cannot gate a release — a dispatch runs against
    # the tip of the selected ref, not an arbitrary commit.
  pull_request:
    branches: [main]
    # The whole surface the acceptance path traverses, not just the keyring:
    # the store and its headless detection, the command that reaches it, the
    # app/CLI lifecycle that builds the store, the entrypoint, the release
    # build shape, the credstore pin, and both workflow files — self-proving,
    # the same trick installer-bash32 uses at test.yml:249.
    paths:
      - 'internal/auth/**'
      - 'internal/appctx/**'
      - 'internal/cli/**'
      - 'internal/commands/auth.go'
      - 'cmd/basecamp/**'
      - '.goreleaser.yaml'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/keychain-acceptance.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions: {}

jobs:
  keychain:
    name: Locked keychain (headless macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Build the release-shaped binary
        run: |
          # Deliberately not `make build`: that bakes -tags dev (Makefile:29-30).
          # goreleaser ships -trimpath with no tags (.goreleaser.yaml:33-34), and
          # the gate is about the artifact users actually install.
          CGO_ENABLED=0 go build -trimpath -o ./bin/basecamp ./cmd/basecamp
          ./bin/basecamp --version

      - name: Open a headless session to localhost
        run: |
          # Remote Login is already On in the hosted image, so this only needs
          # an authorized_keys entry. The key is generated per run and never
          # leaves the runner.
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_keychain_acceptance -q
          cat ~/.ssh/id_keychain_acceptance.pub >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys
          ssh -i ~/.ssh/id_keychain_acceptance -o BatchMode=yes \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR -o ConnectTimeout=15 localhost true

      - name: Assert the ssh session is headless
        run: |
          # sessionIsHeadless() (internal/auth/keyring.go) bounds the probe only
          # when no stream is a terminal AND launchctl reports no Aqua session.
          # Assert both in the session that will actually run the command — the
          # job step itself is Aqua, which is precisely why the command does not
          # run there.
          manager=$(ssh -i ~/.ssh/id_keychain_acceptance -o BatchMode=yes \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR localhost /bin/launchctl managername)
          echo "ssh session managername: $manager"
          if [ "$manager" = "Aqua" ]; then
            echo "::error::ssh session reports an Aqua session — the headless probe bound never engages, so this test proves nothing."
            exit 1
          fi

          # `tty` exits non-zero when stdin is not a terminal, which is the
          # answer we want, so it must not trip `set -e`.
          tty_state=$(ssh -i ~/.ssh/id_keychain_acceptance -o BatchMode=yes \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR localhost tty < /dev/null || true)
          echo "ssh session tty: $tty_state"
          if [ "$tty_state" != "not a tty" ]; then
            echo "::error::ssh session has a TTY ($tty_state) — an interactive session keeps the unbounded probe by design."
            exit 1
          fi

      - name: Assert the void-the-test variables are disarmed
        run: |
          # Either of these skips the code under test entirely, and would leave
          # a green check that proved nothing:
          #   BASECAMP_NO_KEYRING non-empty -> credstore.NewStore returns a
          #     file store without probing (credstore/store.go:68).
          #   BASECAMP_TOKEN non-empty -> auth status returns before
          #     IsAuthenticated(), so the store is never constructed
          #     (internal/commands/auth.go:61).
          # Both are checked for non-emptiness because that is exactly what the
          # production code tests: os.Getenv(...) != "".
          #
          # Checked in the ssh session, not the job: the command runs there, and
          # a login shell profile could set either independently of the job env.
          state=$(ssh -i ~/.ssh/id_keychain_acceptance -o BatchMode=yes \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR localhost \
              'echo "no_keyring=[${BASECAMP_NO_KEYRING:-}] token=[${BASECAMP_TOKEN:-}]"')
          echo "ssh session: $state"
          if [ "$state" != 'no_keyring=[] token=[]' ]; then
            echo "::error::BASECAMP_NO_KEYRING or BASECAMP_TOKEN is non-empty in the ssh session — the credential store would be skipped and this test would prove nothing."
            exit 1
          fi

      - name: Resolve the keychain the probe will hit
        id: keychain
        run: |
          # The bounded probe mirrors go-keyring's darwin Set — `security -i`
          # fed add-generic-password with no -k — so it targets the *default*
          # keychain. Hosted images vary here, so resolve and assert rather
          # than assume login.keychain-db. Resolved in the ssh session, since
          # that is the securityd context the probe runs in.
          raw=$(ssh -i ~/.ssh/id_keychain_acceptance -o BatchMode=yes \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR localhost security default-keychain 2>&1 || true)
          echo "security default-keychain: $raw"
          path=$(printf '%s\n' "$raw" | sed -n 's/^ *"\(.*\)"$/\1/p')
          if [ -z "$path" ]; then
            echo "::error::Could not resolve a default keychain from: $raw"
            exit 1
          fi
          if [ ! -e "$path" ]; then
            echo "::error::Default keychain does not exist on disk: $path"
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Lock the keychain and run a credential-touching command
        id: probe
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.path }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_keychain_acceptance -o BatchMode=yes"
          SSH="$SSH -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          SSH="$SSH -o LogLevel=ERROR localhost"

          $SSH security lock-keychain "$KEYCHAIN"
          echo "--- show-keychain-info (after lock) ---"
          $SSH security show-keychain-info "$KEYCHAIN" 2>&1 || true

          # `auth status` reaches IsAuthenticated() -> Store.ensure() ->
          # credstore.NewStore -> the probe. Streams are redirected on both
          # sides, and ssh without -t allocates no TTY, so sessionIsHeadless()
          # holds and the 10s bound engages.
          #
          # The watchdog runs on the remote side so it kills the binary itself
          # rather than just the ssh client, which would leave the process
          # behind. perl: alarm() survives exec and SIGALRM's default
          # disposition is restored across it, so the timer rides on the
          # binary's own PID. `timeout` is homebrew/coreutils-only and may be
          # absent; a shell background-kill would race PID recycling.
          start=$(perl -MTime::HiRes=time -e 'printf "%.3f\n", time')
          status=0
          $SSH "perl -e 'alarm(60); exec @ARGV or die \"exec: \$!\"' \
                  '$GITHUB_WORKSPACE/bin/basecamp' auth status --json" \
            > /tmp/keychain-stdout.txt 2> /tmp/keychain-stderr.txt < /dev/null \
            || status=$?
          end=$(perl -MTime::HiRes=time -e 'printf "%.3f\n", time')
          elapsed=$(perl -e 'printf "%.3f\n", $ARGV[1] - $ARGV[0]' "$start" "$end")

          echo "elapsed=${elapsed}s exit=${status}"
          {
            echo "elapsed=$elapsed"
            echo "status=$status"
          } >> "$GITHUB_OUTPUT"

      - name: Unlock the keychain
        if: always()
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.path }}
        run: |
          # Diagnostics below read the keychain; leaving it locked would also
          # break any later step on this runner.
          if [ -n "${KEYCHAIN:-}" ]; then
            security unlock-keychain -p "" "$KEYCHAIN" 2>&1 || true
          fi

      - name: Assert the timeout path ran and the bound held
        env:
          ELAPSED: ${{ steps.probe.outputs.elapsed }}
          STATUS: ${{ steps.probe.outputs.status }}
        run: |
          # The floor is what makes this a test rather than a ritual. An
          # earlier manual attempt with a disposable HOME "passed" in 3.21s
          # with -60006: a fast clean failure in which the cancellation path
          # never ran. Without the floor that trap gets promoted to CI, where
          # it would be trusted forever.
          #
          #   >= 8s   the probe really blocked and the bound cut it off
          #   ~3s     fast clean failure — environment did not reproduce #568
          #   <= 25s  the bound held (10s probe + up to 5s cleanup + startup)
          #   60s     watchdog fired — #568 regression
          echo "elapsed=${ELAPSED}s exit=${STATUS}"

          # ssh reports a signalled remote command as exit 255, so accept
          # either that or the direct 128+SIGALRM.
          if [ "$STATUS" = "142" ] || [ "$STATUS" = "255" ]; then
            echo "::error::Watchdog fired at 60s (SIGALRM) — the command never returned. This is the #568 hang."
            exit 1
          fi

          under_floor=$(perl -e 'print(($ARGV[0] < 8.0) ? 1 : 0)' "$ELAPSED")
          if [ "$under_floor" = "1" ]; then
            echo "::error::Completed in ${ELAPSED}s, under the 8s floor — the locked keychain fast-failed instead of blocking, so the cancellation path never ran and this check proves nothing. Do not weaken the floor to make it green."
            exit 1
          fi

          over_ceiling=$(perl -e 'print(($ARGV[0] > 25.0) ? 1 : 0)' "$ELAPSED")
          if [ "$over_ceiling" = "1" ]; then
            echo "::error::Took ${ELAPSED}s, past the 25s ceiling — the headless probe bound did not hold."
            exit 1
          fi

          if [ "$STATUS" != "0" ]; then
            echo "::error::auth status exited $STATUS — it did not complete through the file fallback."
            exit 1
          fi

      - name: Assert the command completed through the fallback
        run: |
          # Exit 0 alone would not prove the command ran to completion. The
          # envelope does. No credentials are seeded: once the keyring is
          # unavailable, reporting not-authenticated *is* the success path.
          cat /tmp/keychain-stdout.txt
          if ! grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' /tmp/keychain-stdout.txt; then
            echo "::error::JSON envelope is not ok:true"
            exit 1
          fi
          if ! grep -Eq '"authenticated"[[:space:]]*:[[:space:]]*false' /tmp/keychain-stdout.txt; then
            echo "::error::Expected authenticated:false in the envelope"
            exit 1
          fi

      - name: Diagnostics
        if: always()
        env:
          ELAPSED: ${{ steps.probe.outputs.elapsed }}
          STATUS: ${{ steps.probe.outputs.status }}
          KEYCHAIN: ${{ steps.keychain.outputs.path }}
        run: |
          echo "elapsed: ${ELAPSED:-<not measured>}"
          echo "exit code: ${STATUS:-<not measured>}"
          echo "default keychain: ${KEYCHAIN:-<unresolved>}"
          echo "--- launchctl managername (job step) ---"
          /bin/launchctl managername 2>&1 || true
          echo "--- launchctl managername (ssh session) ---"
          ssh -i ~/.ssh/id_keychain_acceptance -o BatchMode=yes \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR localhost /bin/launchctl managername 2>&1 || true
          echo "--- security default-keychain ---"
          security default-keychain 2>&1 || true
          echo "--- security show-keychain-info (now) ---"
          if [ -n "${KEYCHAIN:-}" ]; then
            security show-keychain-info "$KEYCHAIN" 2>&1 || true
          fi
          echo "--- stdout ---"
          cat /tmp/keychain-stdout.txt 2>/dev/null || echo "<none>"
          echo "--- stderr ---"
          cat /tmp/keychain-stderr.txt 2>/dev/null || echo "<none>"
